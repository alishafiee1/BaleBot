[project]
name = "balebot"
version = "0.1.0"
description = "Multi-user Bale bot on top of Hermes"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "asyncpg>=0.30",
    "httpx>=0.27",
    "pydantic-settings>=2.6",
    "argon2-cffi>=23.1",
    "tzdata>=2024.2",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "itsdangerous>=2.2",
    "cryptography>=43",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/balebot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "ASYNC109"]
"src/balebot/gateway/*" = ["ASYNC109"]
"src/balebot/net/*" = ["ASYNC109"]
"src/balebot/sandbox/*" = ["ASYNC109"]
"src/balebot/services/keys.py" = ["S105"]
