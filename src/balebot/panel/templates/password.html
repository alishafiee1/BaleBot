{% extends "base.html" %}
{% block title %}تغییر رمز{% endblock %}
{% block content %}
<div class="card" style="max-width:480px">
  <h1>تغییر رمز</h1>
  {% if forced %}<p class="muted">برای ادامه باید رمز اولیه را عوض کنید.</p>{% endif %}
  <form method="post" action="/panel/password" autocomplete="off">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label for="c">رمز فعلی</label>
    <input id="c" name="current" type="password" dir="ltr" required>
    <label for="n">رمز جدید (حداقل ۱۲ کاراکتر)</label>
    <input id="n" name="new" type="password" dir="ltr" minlength="12" required>
    <label for="f">تکرار رمز جدید</label>
    <input id="f" name="confirm" type="password" dir="ltr" minlength="12" required>
    <p><button>ذخیره</button></p>
  </form>
</div>
{% endblock %}
